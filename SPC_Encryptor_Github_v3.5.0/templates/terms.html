<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều khoản sử dụng - SPC Encryptor Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #00ff88;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        h2 {
            color: #00ff88;
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        p,
        li {
            line-height: 1.8;
            margin-bottom: 10px;
            color: #ccc;
        }

        .btn-back {
            display: inline-block;
            padding: 10px 25px;
            background: #00ff88;
            color: #0a0a1a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: #00cc66;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }

        .warning {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>{{ lang_data['terms_title'] }}</h1>

        <div class="warning">
            <strong>⚠️ LƯU Ý:</strong> Đọc kỹ trước khi sử dụng!
        </div>

        {{ lang_data['terms_content'] | replace('## ', '<h2>') | replace('\n\n', '</p>
            <p>') | safe }}

            <div style="text-align: center;">
                <a href="/" class="btn-back">⬅️ Quay lại</a>
            </div>
    </div>
</body>

</html>
